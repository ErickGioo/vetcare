{% extends 'base/base.html' %}
{% block auth_content %}
<div style="min-height:100vh;background:linear-gradient(135deg,#0f3d2e,#1a6b4a);display:flex;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);">
        <div style="text-align:center;margin-bottom:28px;">
            <div style="width:60px;height:60px;background:#f0a500;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;">🐾</div>
            <h3 style="font-weight:800;color:#0f3d2e;margin:0;">VetCare</h3>
            <p style="color:#6c8275;font-size:13px;margin:4px 0 0;">Sistema de Gestión Veterinaria</p>
        </div>
        {% if form.errors %}
        <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100" style="padding:10px;font-weight:700;">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>
{% endblock %}
