{% extends 'base/base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card"><div class="card-header">{{ titulo }}</div>
<div class="card-body">
<form method="post">{% csrf_token %}
<div class="row g-3">{% for field in form %}
<div class="col-md-6"><label class="form-label">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
{% endfor %}</div>
<div class="d-flex gap-2 mt-4">
<button type="submit" class="btn btn-primary">Crear Venta y Agregar Productos</button>
<a href="{% url 'ventas:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
</div></form></div></div>
</div></div>
{% endblock %}
